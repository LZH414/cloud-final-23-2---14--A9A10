apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-native-demo
  namespace: argocd
  labels:
    app: cloud-native-demo
spec:
  project: cloud-native-demo
  
  source:
    repoURL: https://github.com/your-username/cloud-native-demo.git
    targetRevision: HEAD
    path: k8s
    helm:
      valueFiles:
      - values.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: cloud-native-demo
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
