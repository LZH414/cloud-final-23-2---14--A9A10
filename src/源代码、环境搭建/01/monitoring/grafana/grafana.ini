{
  "analytics": {
    "check_for_updates": true,
    "check_for_plugin_updates": true,
    "check_for_updates_interval_seconds": 21600,
    "google_analytics_ua_id": "",
    "reporting_enabled": true
  },
  "build_info": {
    "build_commit": "",
    "build_version": ""
  },
  "dashboards": {
    "default_home_dashboard_path": ""
  },
  "date_formats": {
    "full_date": "YYYY-MM-DD HH:mm:ss",
    "interval_second": "s",
    "interval_minute": "m",
    "interval_hour": "h",
    "interval_day": "d",
    "interval_week": "w",
    "interval_month": "M",
    "interval_year": "y"
  },
  "datasources": {
    "datasources": {
      "Prometheus": {
        "type": "prometheus",
        "access": "proxy",
        "url": "http://prometheus:9090",
        "isDefault": true,
        "jsonData": {
          "timeInterval": "15s"
        }
      },
      "Loki": {
        "type": "loki",
        "access": "proxy",
        "url": "http://loki:3100",
        "jsonData": {
          "maxLines": 1000
        }
      }
    }
  },
  "log": {
    "mode": "console",
    "level": "info"
  },
  "security": {
    "admin_user": "admin",
    "admin_password": "admin"
  },
  "server": {
    "root_url": "",
    "serve_from_sub_path": false
  }
}
