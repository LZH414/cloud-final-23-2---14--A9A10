groups:
  - name: app_alerts
    interval: 30s
    rules:
      - alert: AppDown
        expr: up{job="cloud-native-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "应用实例 {{ $labels.instance }} 不可用"
          description: "应用实例 {{ $labels.instance }} 已经宕机超过1分钟"

      - alert: HighErrorRate
        expr: rate(http_requests_total{code=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "应用错误率过高"
          description: "应用 {{ $labels.job }} 的5xx错误率在过去5分钟内超过5%"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "应用响应延迟过高"
          description: "应用 {{ $labels.job }} 的P95延迟在过去5分钟内超过1秒"

      - alert: LowRequestRate
        expr: rate(http_requests_total[5m]) < 0.1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "应用请求率过低"
          description: "应用 {{ $labels.job }} 的请求率在过去10分钟内低于0.1 req/s"

  - name: system_alerts
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU使用率过高"
          description: "实例 {{ $labels.instance }} 的CPU使用率在过去5分钟内超过80%"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率过高"
          description: "实例 {{ $labels.instance }} 的内存使用率在过去5分钟内超过85%"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "磁盘空间不足"
          description: "实例 {{ $labels.instance }} 的根分区可用空间低于15%"
