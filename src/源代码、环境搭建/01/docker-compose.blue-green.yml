version: '3.8'

services:
  blue:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloud-native-demo:blue
    container_name: cloud-native-demo-blue
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_VERSION=blue
    volumes:
      - ./logs:/app/logs
    networks:
      - blue-green

  green:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloud-native-demo:green
    container_name: cloud-native-demo-green
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - APP_VERSION=green
    volumes:
      - ./logs:/app/logs
    networks:
      - blue-green

  nginx:
    image: nginx:alpine
    container_name: cloud-native-demo-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - blue
      - green
    networks:
      - blue-green

networks:
  blue-green:
    driver: bridge
